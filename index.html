<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Bregan MainsFlow Stock</title>
    <meta name="description" content="A stock management application for tracking items, assigning them to locations and teams via barcode scanning. Designed for teams working with Bregan MainsFlow Ltd." />
    <meta property="og:title" content="Bregan MainsFlow Stock" />
    <meta property="og:description" content="A stock management application for tracking items, assigning them to locations and teams via barcode scanning. Designed for teams working with Bregan MainsFlow Ltd." />
    <script>
      // This script unregisters any active service workers.
      // It's a robust way to fix issues caused by stale service workers
      // from previous development sessions, which can interfere with Vite's HMR.
      if ('serviceWorker' in navigator) {
        const url = new URL(window.location.href);
        const swUnregistered = url.searchParams.get('sw-unregistered');

        if (!swUnregistered) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            if (registrations.length > 0) {
              console.log('Unregistering ' + registrations.length + ' service worker(s).');
              Promise.all(registrations.map(r => r.unregister())).then(() => {
                // Add a query param to prevent an infinite reload loop.
                url.searchParams.set('sw-unregistered', 'true');
                window.location.href = url.href;
              });
            }
          });
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="bg-zinc-100 dark:bg-zinc-900">
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
